<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a6b3c"/>
      <stop offset="100%" stop-color="#0d3620"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad)" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#f59e0b" stroke-width="6" stroke-opacity="0.4"/>
  <!-- Medical Cross -->
  <g fill="#ffffff">
    <rect x="216" y="116" width="80" height="280" rx="16"/>
    <rect x="116" y="216" width="280" height="80" rx="16"/>
  </g>
  <!-- Inner Gold Heart Accent -->
  <circle cx="256" cy="256" r="28" fill="#f59e0b"/>
</svg>
